name: build-exe
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write     # 發佈新版（Release）給 PAPA 的「檢查更新」用
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - uses: ilammy/msvc-dev-cmd@v1
      - name: 編譯 C++ 底層引擎
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /utf-8 /DNOMINMAX /LD native\src\fx_api.cpp native\src\engine.cpp /Fe:papa_engine.dll ole32.lib
      - name: 測試 C++ 底層引擎
        run: |
          python test_native_dsp.py
          python test_lowlat.py
          python test_native_engine.py
      - name: 離線測試
        run: |
          python test_dsp.py
          python test_engine.py
          python test_updater.py
          $env:PAPA_FORCE_PY="1"; python test_gui.py; $env:PAPA_FORCE_PY=""
          python test_gui_native.py
      - name: 畫面截圖（檢查版面用）
        continue-on-error: true
        run: |
          pip install pillow
          python shot_gui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      - name: 寫入版本編號
        shell: pwsh
        run: |
          "VERSION = ${{ github.run_number }}" | Out-File -Encoding utf8 version.py
          (Get-Content -Raw -Encoding utf8 version_info.txt).Replace('BUILD', '${{ github.run_number }}') | Out-File -Encoding utf8 version_info_build.txt
      - name: 打包 exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PaPaVoiceFx --version-file version_info_build.txt
          --collect-all sounddevice --collect-all soundcard
          --add-binary "papa_engine.dll;." --hidden-import native_engine --hidden-import native_fx
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --exclude-module matplotlib --exclude-module pandas --exclude-module PIL --exclude-module IPython
          app.py
      - name: 確認 exe 能載入套件
        shell: pwsh
        run: |
          python -c "import sounddevice, soundcard, numpy, scipy.signal, pynput.keyboard, tkinter; print('loopback:', [m.name for m in soundcard.all_microphones(include_loopback=True)]); print('imports ok', sounddevice.get_portaudio_version())"
          Get-Item dist/PaPaVoiceFx.exe | Select-Object Name, Length
          $vi = (Get-Item dist/PaPaVoiceFx.exe).VersionInfo
          "作者：" + $vi.CompanyName + "　產品：" + $vi.ProductName + "　版本：" + $vi.ProductVersion
          if ($vi.CompanyName -ne '怕怕') { throw "exe 的作者不是怕怕" }
      - uses: actions/upload-artifact@v4
        with:
          name: PaPaVoiceFx-exe
          path: dist/PaPaVoiceFx.exe
      - name: 發佈新版（PAPA 按「檢查更新」就會抓這個）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | Out-File -Encoding utf8 notes.txt
          gh release create "v${{ github.run_number }}" dist/PaPaVoiceFx.exe --title "PAPA 調音台 第 ${{ github.run_number }} 版" --notes-file notes.txt --latest
