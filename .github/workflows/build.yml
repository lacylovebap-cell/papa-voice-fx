name: build-exe
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: 離線測試
        run: |
          python test_dsp.py
          python test_engine.py
          python test_gui.py
      - name: 打包 exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PaPaVoiceFx
          --collect-all sounddevice
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --exclude-module matplotlib --exclude-module pandas --exclude-module PIL --exclude-module IPython
          app.py
      - name: 確認 exe 能載入套件
        shell: pwsh
        run: |
          python -c "import sounddevice, numpy, scipy.signal, pynput.keyboard, tkinter; print('imports ok', sounddevice.get_portaudio_version())"
          Get-Item dist/PaPaVoiceFx.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: PaPaVoiceFx-exe
          path: dist/PaPaVoiceFx.exe
