name: build-exe
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - uses: ilammy/msvc-dev-cmd@v1
      - name: 編譯 C++ 底層引擎
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /utf-8 /DNOMINMAX /LD native\src\fx_api.cpp native\src\engine.cpp /Fe:papa_engine.dll ole32.lib
      - name: 測試 C++ 底層引擎
        run: |
          python test_native_dsp.py
          python test_lowlat.py
          python test_native_engine.py
      - name: 離線測試
        run: |
          python test_dsp.py
          python test_engine.py
          $env:PAPA_FORCE_PY="1"; python test_gui.py; $env:PAPA_FORCE_PY=""
          python test_gui_native.py
      - name: 打包 exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PaPaVoiceFx
          --collect-all sounddevice --collect-all soundcard
          --add-binary "papa_engine.dll;." --hidden-import native_engine --hidden-import native_fx
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --exclude-module matplotlib --exclude-module pandas --exclude-module PIL --exclude-module IPython
          app.py
      - name: 確認 exe 能載入套件
        shell: pwsh
        run: |
          python -c "import sounddevice, soundcard, numpy, scipy.signal, pynput.keyboard, tkinter; print('loopback:', [m.name for m in soundcard.all_microphones(include_loopback=True)]); print('imports ok', sounddevice.get_portaudio_version())"
          Get-Item dist/PaPaVoiceFx.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: PaPaVoiceFx-exe
          path: dist/PaPaVoiceFx.exe
